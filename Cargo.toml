[package]
name = "mermaid_to_svg"
version = "0.1.0"
edition = "2021"
authors = ["Warp Team <dev@warp.dev>"]
description = "Convert Mermaid diagram syntax to SVG"
license = "MIT"

[dependencies]
regex = "1"
thiserror = "1.0"
dagre_rust = { path = "crates/dagre_rust" }  # vendored from 0.0.5 with fixes
graphlib_rust = "0.0.2"
petgraph = "0.8.3"
unicode-segmentation = "1.11"
serde_yaml = "0.9.34"

[dev-dependencies]
insta = "1.34"
anyhow = "1.0"
rust-embed = { version = "8.7.0", features = ["include-exclude"] }
image = { version = "0.25.2", default-features = false, features = ["rayon", "jpeg", "png", "gif", "webp"] }
resvg = "0.45.0"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "render_mermaid"
path = "src/bin/render_mermaid.rs"
